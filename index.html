<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smilemo JS - Extended Level with Checkpoints</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { background: #101010; display: block; margin: auto; }
  </style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

class Player {
  constructor() {
    this.reset(50, 350);
  }

  reset(x, y) {
    this.x = x;
    this.y = y;
    this.w = 28;
    this.h = 28;
    this.vx = 0;
    this.vy = 0;
    this.onGround = false;
    this.controlLocked = false;
    this.lockTimer = 0;
  }

  update() {
    if (this.controlLocked) {
      this.lockTimer -= 1/60;
      if (this.lockTimer <= 0) this.controlLocked = false;
    }

    // gravity
    this.vy += 0.5;

    if (!this.controlLocked) {
      // left/right
      if (keys["ArrowLeft"] || keys["KeyA"]) this.vx = -3;
      else if (keys["ArrowRight"] || keys["KeyD"]) this.vx = 3;
      else this.vx = 0;

      // jump
      if ((keys["Space"] || keys["KeyW"] || keys["ArrowUp"]) && this.onGround) {
        this.vy = -10;
        this.onGround = false;
      }
    }

    // apply velocity
    this.x += this.vx;
    this.y += this.vy;

    // collision with platforms
    this.onGround = false;
    for (let p of platforms) {
      if (this.x < p.x + p.w &&
          this.x + this.w > p.x &&
          this.y < p.y + p.h &&
          this.y + this.h > p.y) {
        if (this.vy > 0) {
          this.y = p.y - this.h;
          this.vy = 0;
          this.onGround = true;
        }
      }
    }

    // virus strike collision
    for (let v of viruses) {
      if (this.x < v.x + v.w &&
          this.x + this.w > v.x &&
          this.y < v.y + v.h &&
          this.y + this.h > v.y) {
        this.vx = -6;   // knockback
        this.vy = -12;
        this.controlLocked = true;
        this.lockTimer = 1;
      }
    }

    // checkpoint collision
    for (let c of checkpoints) {
      if (this.x < c.x + c.w &&
          this.x + this.w > c.x &&
          this.y < c.y + c.h &&
          this.y + this.h > c.y) {
        c.activated = true;
        lastCheckpoint = { x: c.x, y: c.y - this.h };
      }
    }

    // fall reset
    if (this.y > canvas.height + 200) {
      this.reset(lastCheckpoint.x, lastCheckpoint.y);
    }
  }

  draw(offsetX) {
    // smiley face
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(this.x - offsetX + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.stroke();

    // eyes
    ctx.fillStyle = "black";
    ctx.fillRect(this.x - offsetX + 7, this.y + 8, 4, 6);
    ctx.fillRect(this.x - offsetX + 17, this.y + 8, 4, 6);

    // smile
    ctx.beginPath();
    ctx.arc(this.x - offsetX + this.w/2, this.y + this.h/2 + 2, 8, 0, Math.PI);
    ctx.stroke();
  }
}

class Platform {
  constructor(x,y,w,h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
  }
  draw(offsetX) {
    ctx.fillStyle = "#00cc44"; // green
    ctx.fillRect(this.x - offsetX, this.y, this.w, this.h);
  }
}

class Virus {
  constructor(x,y,w,h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
  }
  draw(offsetX) {
    ctx.fillStyle = "red";
    ctx.fillRect(this.x - offsetX, this.y, this.w, this.h);
  }
}

class Checkpoint {
  constructor(x,y) {
    this.x = x;
    this.y = y;
    this.w = 24;
    this.h = 24;
    this.activated = false;
  }
  draw(offsetX) {
    ctx.fillStyle = this.activated ? "cyan" : "blue";
    ctx.fillRect(this.x - offsetX, this.y, this.w, this.h);
  }
}

let player = new Player();

// base level scaled 100x
let platforms = [];
let viruses = [];
let checkpoints = [];
let lastCheckpoint = { x: 50, y: 350 };

// ground floor (long)
platforms.push(new Platform(0, 420, 800*100, 30));

// floating platforms & viruses
for (let i=1; i<=100; i++) {
  if (i % 15 === 0) platforms.push(new Platform(i*300, 340, 120, 20));
  if (i % 20 === 0) platforms.push(new Platform(i*300, 260, 120, 20));
  if (i % 10 === 0) viruses.push(new Virus(i*250, 380, 10, 60)); // strike
  if (i % 25 === 0) viruses.push(new Virus(i*300+60, 240, 10, 60)); 
  if (i % 30 === 0) checkpoints.push(new Checkpoint(i*300, 300));
}

function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  player.update();

  // camera
  let offsetX = player.x - canvas.width/2;
  if (offsetX < 0) offsetX = 0;

  // draw level
  for (let p of platforms) p.draw(offsetX);
  for (let v of viruses) v.draw(offsetX);
  for (let c of checkpoints) c.draw(offsetX);

  player.draw(offsetX);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
